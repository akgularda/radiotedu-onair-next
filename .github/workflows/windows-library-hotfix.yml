name: Windows library fairness qualification
on:
  push:
    branches: [deploy/existing16-20261105]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.402
      - name: Restore locked test and engine dependencies
        run: dotnet restore tests/OnAirNext.Tests/OnAirNext.Tests.csproj --locked-mode --disable-parallel -m:1 -p:ArtifactsPath=${{ github.workspace }}/artifacts/fair-build
      - name: Qualify station library and branding behavior
        run: dotnet test tests/OnAirNext.Tests/OnAirNext.Tests.csproj -c Release --no-restore -m:1 -p:ArtifactsPath=${{ github.workspace }}/artifacts/fair-build --logger "trx;LogFileName=fair-library.trx" --results-directory artifacts/fair-results
      - name: Download the retained qualified codec runtime
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-codec-runtime
          path: artifacts/windows-codec-runtime
          run-id: 42093806410
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the retained codec runtime
        run: python scripts/codec/verify-runtime-files.py artifacts/windows-codec-runtime
      - name: Build the isolated source cue qualification
        run: |
          dotnet restore tests/OnAirNext.Lab/OnAirNext.Lab.csproj --locked-mode --disable-parallel -m:1 -p:ArtifactsPath=${{ github.workspace }}/artifacts/fair-build
          dotnet build tests/OnAirNext.Lab/OnAirNext.Lab.csproj -c Release --no-restore -m:1 -p:ArtifactsPath=${{ github.workspace }}/artifacts/fair-build
      - name: Check real decoding, exact cue frames, Unicode tags and finite programme transitions
        run: dotnet artifacts/fair-build/bin/OnAirNext.Lab/release/OnAirNext.Lab.dll --source-cue-qualification "${{ github.workspace }}/artifacts/windows-codec-runtime/bin/ffmpeg.exe" "${{ github.workspace }}/artifacts/source-cues"
      - name: Retain exact engine and test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: library-fairness-hotfix
          path: |
            artifacts/fair-build/bin/OnAirNext.Engine/release/OnAirNext.Engine.dll
            artifacts/fair-results/fair-library.trx
            artifacts/source-cues/source-cue-evidence.json
          if-no-files-found: error
