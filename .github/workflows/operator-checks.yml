name: Operator workflow software checks
on:
  workflow_dispatch:
  push:
    branches: [operator-workflows-20261025]
  pull_request:
permissions:
  contents: read
concurrency:
  group: operator-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.402
      - name: Restore locked software dependencies
        run: dotnet restore OnAirNext.slnx --locked-mode --disable-parallel -m:1
      - name: Compile application and isolated fixtures
        run: dotnet build OnAirNext.slnx -c Release --no-restore -m:1 /p:UseSharedCompilation=false /p:BuildInParallel=false
      - name: Run domain, persistence, recovery and control tests
        run: dotnet test tests/OnAirNext.Tests/OnAirNext.Tests.csproj -c Release --no-build --logger trx --results-directory artifacts/operator-checks
      - name: Run browser model tests
        shell: pwsh
        run: |
          $specs = @(Get-ChildItem -LiteralPath tests/browser -Filter '*.test.cjs' -File | ForEach-Object FullName)
          if ($specs.Count -eq 0) { throw 'No browser model tests were discovered.' }
          & node --test @specs
          if ($LASTEXITCODE -ne 0) { throw 'Browser model tests failed.' }
      - name: Retain software test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: operator-software-checks
          path: artifacts/operator-checks
          if-no-files-found: ignore
