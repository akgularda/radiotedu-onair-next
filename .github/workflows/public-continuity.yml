name: Independent public stream continuity
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-continuity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare decoder on disposable runner
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Validate observer syntax
        run: node --check scripts/observe-public-continuity.cjs
      - name: Observe two existing HTTPS listeners without station control
        run: node scripts/observe-public-continuity.cjs 900 radio radio-low
      - name: Retain timing metadata without audio or source credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-public-continuity
          path: artifacts/public-continuity.jsonl
          if-no-files-found: error
