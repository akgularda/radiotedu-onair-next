name: Windows build and unit tests
on:
  pull_request:
  push:
    branches: [main, broadcast-pc-recovery-20261015]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  loudness-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_PROCESSOR_COUNT: '2'
      LC_ALL: C
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.402
      - name: Prepare independent FFmpeg meter on disposable runner
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
      - name: Restore standalone measurement fixture with locked dependencies
        run: dotnet restore tests/OnAirNext.LoudnessReference/OnAirNext.LoudnessReference.csproj --locked-mode
      - name: Compare synthetic reference signals with independent EBU meter
        run: dotnet run --project tests/OnAirNext.LoudnessReference/OnAirNext.LoudnessReference.csproj -c Release --no-restore -- artifacts/loudness-reference
      - name: Retain scoped instrument qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loudness-reference-qualification
          path: artifacts/loudness-reference/summary.json
          if-no-files-found: error
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.402
      - name: Restore locked dependencies
        run: dotnet restore OnAirNext.slnx --locked-mode --disable-parallel -m:1
      - name: Build browser console and engine
        run: dotnet build OnAirNext.slnx -c Release --no-restore -m:1 /p:UseSharedCompilation=false /p:BuildInParallel=false
      - name: Run focused unit tests
        run: dotnet test tests/OnAirNext.Tests/OnAirNext.Tests.csproj -c Release --no-build --logger "trx;LogFileName=engine-tests.trx" --results-directory artifacts/test-results
      - name: Verify meter display states and script syntax
        run: |
          node --check src/OnAirNext.Web/wwwroot/studio.js
          node --test tests/browser/loudness-view.test.cjs
      - name: Retain unit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-unit-results
          path: artifacts/test-results
          if-no-files-found: warn
      - name: Locate compiled binaries
        run: '"ONAIR_BUILD_BIN=$env:LOCALAPPDATA/RadioTEDU/OnAirNext-Dev/build/bin" >> $env:GITHUB_ENV'
      - name: Qualify real float PCM and isolated audio codecs
        run: ./scripts/Test-WindowsAudio.ps1 -BuildRoot "$env:ONAIR_BUILD_BIN"
      - name: Retain real isolated audio qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-real-audio-qualification
          path: artifacts/windows-audio/summary.json
          if-no-files-found: warn
      - name: Qualify isolated Windows service lifecycle
        run: ./scripts/Test-WindowsService.ps1 -BuildRoot "$env:ONAIR_BUILD_BIN"
      - name: Retain isolated service qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-service-qualification
          path: artifacts/service-smoke/summary.json
          if-no-files-found: warn
      - name: Publish self-contained Windows development package
        run: ./scripts/Package-Windows.ps1
      - name: Qualify guided Windows setup on disposable runner
        run: ./scripts/Test-WindowsSetup.ps1 -BuildRoot "$env:ONAIR_BUILD_BIN" -PackageRoot artifacts/windows-package
      - name: Retain setup qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-setup-qualification
          path: artifacts/setup-smoke/summary.json
          if-no-files-found: warn
      - name: Retain compiled development binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-development-build
          path: ${{ env.ONAIR_BUILD_BIN }}
          retention-days: 7
          if-no-files-found: error
      - name: Retain browser console separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-browser-console
          path: ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Web/release
          retention-days: 7
          if-no-files-found: error
      - name: Retain isolated host separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-isolated-host
          path: |
            ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Host/release/*.dll
            ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Host/release/*.exe
            ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Host/release/*.json
            ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Host/release/runtimes/win-x64/native/*.dll
          retention-days: 7
          if-no-files-found: error
      - name: Retain Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable-setup
          path: artifacts/windows-package
          retention-days: 7
          if-no-files-found: error
      - name: Retain runtime expansion locks and package measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-runtime-package-evidence
          path: |
            artifacts/windows-runtime-locks
            artifacts/windows-package-summary.json
          if-no-files-found: warn
