name: Windows build and unit tests
on:
  pull_request:
  push:
    branches: [main, broadcast-pc-recovery-20261015]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_PROCESSOR_COUNT: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.402
      - name: Restore locked dependencies
        run: dotnet restore OnAirNext.slnx --locked-mode --disable-parallel -m:1
      - name: Build browser console and engine
        run: dotnet build OnAirNext.slnx -c Release --no-restore -m:1 /p:UseSharedCompilation=false /p:BuildInParallel=false
      - name: Run focused unit tests
        run: dotnet test tests/OnAirNext.Tests/OnAirNext.Tests.csproj -c Release --no-build --logger "trx;LogFileName=engine-tests.trx" --results-directory artifacts/test-results
      - name: Retain unit test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-unit-results
          path: artifacts/test-results
          if-no-files-found: warn
      - name: Locate compiled binaries
        run: '"ONAIR_BUILD_BIN=$env:LOCALAPPDATA/RadioTEDU/OnAirNext-Dev/build/bin" >> $env:GITHUB_ENV'
      - name: Qualify isolated Windows service lifecycle
        run: ./scripts/Test-WindowsService.ps1 -BuildRoot "$env:ONAIR_BUILD_BIN"
      - name: Retain isolated service qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-service-qualification
          path: artifacts/service-smoke/summary.json
          if-no-files-found: warn
      - name: Retain compiled development binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-development-build
          path: ${{ env.ONAIR_BUILD_BIN }}
          retention-days: 7
          if-no-files-found: error
      - name: Retain browser console separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-browser-console
          path: ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Web/release
          retention-days: 7
          if-no-files-found: error
      - name: Retain isolated host separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-isolated-host
          path: |
            ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Host/release/*.dll
            ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Host/release/*.exe
            ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Host/release/*.json
            ${{ env.ONAIR_BUILD_BIN }}/OnAirNext.Host/release/runtimes/win-x64/native/*.dll
          retention-days: 7
          if-no-files-found: error
